# XcodeGen recipe. GitHub's Mac turns this into the Xcode project on every build,
# so nobody has to open Xcode. Edit here, not in a .xcodeproj.
name: MKmusic
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  MKmusic:
    type: application
    platform: iOS
    sources:
      - MKmusic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mkmusic
        PRODUCT_NAME: MKmusic
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: MKmusic/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: NO
